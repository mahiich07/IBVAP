version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI REST API & Real-Time WebSocket Gateway
  # ----------------------------------------------------------------------------
  ibvap-backend:
    build:
      context: ./ibvap-backend
      dockerfile: Dockerfile
    container_name: ibvap-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IBVAP_HOST=0.0.0.0
      - IBVAP_PORT=8000
      - IBVAP_NODE_ID=BOP-ALPHA-EDGE-01
      - DATABASE_PATH=/app/data/ibvap.db
      - IBVAP_SECRET_KEY=b0rd3r-d3f3ns3-s1h-2026-s3cur3-k3y-m1l1t4ry-gr4d3
    volumes:
      - ibvap-data:/app/data
    networks:
      - ibvap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. React Command Center Dashboard (Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  ibvap-frontend:
    build:
      context: ./ibvap-platform
      dockerfile: Dockerfile
    container_name: ibvap-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      ibvap-backend:
        condition: service_healthy
    networks:
      - ibvap-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Edge Computer Vision Inference Worker (YOLO, ByteTrack, Face, ANPR)
  # ----------------------------------------------------------------------------
  ibvap-edge-worker:
    build:
      context: ./ibvap-backend
      dockerfile: Dockerfile.edge-worker
    container_name: ibvap-edge-worker
    restart: unless-stopped
    environment:
      - IBVAP_NODE_ID=BOP-ALPHA-EDGE-01
      - DATABASE_PATH=/app/data/ibvap.db
    volumes:
      - ibvap-data:/app/data
    depends_on:
      ibvap-backend:
        condition: service_healthy
    networks:
      - ibvap-net

# ------------------------------------------------------------------------------
# Shared Persistent Storage & Isolated Network Bridge
# ------------------------------------------------------------------------------
volumes:
  ibvap-data:
    name: ibvap-persistent-ledger
    driver: local

networks:
  ibvap-net:
    name: ibvap-defense-network
    driver: bridge
